name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP
        run: unzip Tawlati_GitHub.zip

      - name: Make gradlew executable
        run: chmod +x Tawlati/gradlew

      - name: Build APK
        run: cd Tawlati && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tawlati-APK
          path: Tawlati/app/build/outputs/apk/debug/app-debug.apk
